name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"

jobs:
  conventions:
    name: Conventions
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint:commits
      - run: npm run format:check
      - run: npm run test:automation
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: python3 scripts/check-version.py
      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  macos:
    name: macOS build and tests
    if: ${{ !github.event.deleted }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = arm64
          swift --version
      - name: Run regression tests
        run: swift run NotchVeilTests
      - name: Build, sign, and verify packaged localization
        run: bash scripts/build-app.sh
      - name: Check source scripts
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NotchVeil-macOS-arm64-${{ github.sha }}
          path: dist/NotchVeil-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 7
